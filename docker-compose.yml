# version: "3.8"

# WFM Unified System - Complete Orchestrator
# This file manages all services with proper startup order and dependencies

services:
  # 1. DATABASES LAYER - Start First
  postgres:
    image: postgres:15
    container_name: wfm-postgres
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: workflow_user
      POSTGRES_PASSWORD: workflow_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./wfmProcess/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - wfm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow_user -d workflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wfm-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - wfm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: wfm-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: wfmadmin
      MONGO_INITDB_ROOT_PASSWORD: tsarolabs@12345#
      MONGO_INITDB_DATABASE: wfm
    volumes:
      - mongodb_data:/data/db
      - ./wfmServices/docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    ports:
      - "27017:27017"
    networks:
      - wfm-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 2. BACKEND SERVICES LAYER - Start after databases are healthy
  api-gateway:
    build:
      context: ./wfmServices
      dockerfile: Dockerfile
    container_name: wfm_api_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://wfmadmin:tsarolabs%4012345%23@wfm-mongodb:27017/wfm?authSource=admin
      - MONGODB_TLS=false
      - REDIS_URL=redis://wfm-redis:6379
      - DATABASE_NAME=wfm
      - JWT_SECRET_KEY=wfmv4-super-secret-jwt-key-change-in-production
      - ENVIRONMENT=development
      - ENV_FILE=env.local
      - VENDOR_SERVICE_URL=http://wfm_vendor_service:8009
    volumes:
      - ./wfmServices/logs:/app/logs
    networks:
      - wfm-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  auth-service:
    build:
      context: ./wfmServices
      dockerfile: Dockerfile.auth
    container_name: wfm_auth_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - MONGODB_URL=mongodb://wfmadmin:tsarolabs%4012345%23@wfm-mongodb:27017/wfm?authSource=admin
      - MONGODB_TLS=false
      - REDIS_URL=redis://wfm-redis:6379
      - DATABASE_NAME=wfm
      - JWT_SECRET_KEY=wfmv4-super-secret-jwt-key-change-in-production
      - ENVIRONMENT=development
      - ENV_FILE=env.local
    networks:
      - wfm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  config-service:
    build:
      context: ./wfmServices
      dockerfile: Dockerfile
    container_name: wfm_config_service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - MONGODB_URL=mongodb://wfmadmin:tsarolabs%4012345%23@wfm-mongodb:27017/wfm?authSource=admin
      - MONGODB_TLS=false
      - REDIS_URL=redis://wfm-redis:6379
      - DATABASE_NAME=wfm
      - JWT_SECRET_KEY=wfmv4-super-secret-jwt-key-change-in-production
      - ENVIRONMENT=development
      - ENV_FILE=env.local
    volumes:
      - ./wfmServices/logs:/app/logs
    networks:
      - wfm-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  rules-service:
    build:
      context: ./wfmServices
      dockerfile: Dockerfile
    container_name: wfm_rules_service
    restart: unless-stopped
    ports:
      - "8003:8003"
    entrypoint: ["python"]
    command: ["-m", "rules_service.main"]
    environment:
      - MONGODB_URL=mongodb://wfmadmin:tsarolabs%4012345%23@wfm-mongodb:27017/wfm?authSource=admin
      - MONGODB_TLS=false
      - REDIS_URL=redis://wfm-redis:6379
      - DATABASE_NAME=wfm
      - JWT_SECRET_KEY=wfmv4-super-secret-jwt-key-change-in-production
      - ENVIRONMENT=development
      - ENV_FILE=env.local
    volumes:
      - ./wfmServices/logs:/app/logs
    networks:
      - wfm-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  workflow-instance-service:
    build:
      context: ./wfmServices
      dockerfile: Dockerfile
    container_name: wfm_workflow_instance_service
    restart: unless-stopped
    ports:
      - "8011:8011"
    entrypoint: ["sh", "-c"]
    command: ["PYTHONPATH=/app python -m workflow_instance_service.main"]
    environment:
      - POSTGRESQL_URL=postgresql://workflow_user:workflow_pass@wfm-postgres:5432/workflow
      - MONGODB_URL=mongodb://wfmadmin:tsarolabs%4012345%23@wfm-mongodb:27017/wfm?authSource=admin
      - MONGODB_TLS=false
      - REDIS_URL=redis://wfm-redis:6379
      - DATABASE_NAME=wfm
      - JWT_SECRET_KEY=wfmv4-super-secret-jwt-key-change-in-production
      - ENVIRONMENT=development
      - ENV_FILE=env.local
    volumes:
      - ./wfmServices/logs:/app/logs
    networks:
      - wfm-network
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  order-service:
    build:
      context: ./wfmServices
      dockerfile: Dockerfile
    container_name: wfm_order_service
    restart: unless-stopped
    ports:
      - "8008:8008"
    entrypoint: ["python"]
    command: ["-m", "order_service.main"]
    environment:
      - MONGODB_URL=mongodb://wfmadmin:tsarolabs%4012345%23@wfm-mongodb:27017/wfm?authSource=admin
      - MONGODB_TLS=false
      - REDIS_URL=redis://wfm-redis:6379
      - DATABASE_NAME=wfm
      - JWT_SECRET_KEY=wfmv4-super-secret-jwt-key-change-in-production
      - ENVIRONMENT=development
      - ENV_FILE=env.local
    volumes:
      - ./wfmServices/logs:/app/logs
    networks:
      - wfm-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler-service:
    build:
      context: ./wfmServices
      dockerfile: Dockerfile
    container_name: wfm_scheduler_service
    restart: unless-stopped
    ports:
      - "8004:8004"
    entrypoint: ["python"]
    command: ["-m", "scheduler_service.main"]
    environment:
      - MONGODB_URL=mongodb://wfmadmin:tsarolabs%4012345%23@wfm-mongodb:27017/wfm?authSource=admin
      - MONGODB_TLS=false
      - REDIS_URL=redis://wfm-redis:6379
      - DATABASE_NAME=wfm
      - JWT_SECRET_KEY=wfmv4-super-secret-jwt-key-change-in-production
      - ENVIRONMENT=development
      - ENV_FILE=env.local
    volumes:
      - ./wfmServices/logs:/app/logs
    networks:
      - wfm-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  issue-service:
    build:
      context: ./wfmServices
      dockerfile: Dockerfile
    container_name: wfm_issue_service
    restart: unless-stopped
    ports:
      - "8005:8005"
    entrypoint: ["python"]
    command: ["-m", "issue_service.main"]
    environment:
      - MONGODB_URL=mongodb://wfmadmin:tsarolabs%4012345%23@wfm-mongodb:27017/wfm?authSource=admin
      - MONGODB_TLS=false
      - REDIS_URL=redis://wfm-redis:6379
      - DATABASE_NAME=wfm
      - JWT_SECRET_KEY=wfmv4-super-secret-jwt-key-change-in-production
      - ENVIRONMENT=development
      - ENV_FILE=env.local
    volumes:
      - ./wfmServices/logs:/app/logs
    networks:
      - wfm-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics-service:
    build:
      context: ./wfmServices
      dockerfile: Dockerfile
    container_name: wfm_analytics_service
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      - MONGODB_URL=mongodb://wfmadmin:tsarolabs%4012345%23@wfm-mongodb:27017/wfm?authSource=admin
      - MONGODB_TLS=false
      - REDIS_URL=redis://wfm-redis:6379
      - DATABASE_NAME=wfm
      - JWT_SECRET_KEY=wfmv4-super-secret-jwt-key-change-in-production
      - ENVIRONMENT=development
      - ENV_FILE=env.local
    volumes:
      - ./wfmServices/logs:/app/logs
    networks:
      - wfm-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard-service:
    build:
      context: ./wfmServices
      dockerfile: Dockerfile
    container_name: wfm_dashboard_service
    restart: unless-stopped
    ports:
      - "8007:8007"
    entrypoint: ["python"]
    command: ["-m", "dashboard_service.main"]
    environment:
      - MONGODB_URL=mongodb://wfmadmin:tsarolabs%4012345%23@wfm-mongodb:27017/wfm?authSource=admin
      - MONGODB_TLS=false
      - REDIS_URL=redis://wfm-redis:6379
      - DATABASE_NAME=wfm
      - JWT_SECRET_KEY=wfmv4-super-secret-jwt-key-change-in-production
      - ENVIRONMENT=development
      - ENV_FILE=env.local
    volumes:
      - ./wfmServices/logs:/app/logs
    networks:
      - wfm-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  vendor-service:
    build:
      context: ./wfmServices
      dockerfile: Dockerfile
    container_name: wfm_vendor_service
    restart: unless-stopped
    ports:
      - "8009:8009"
    entrypoint: ["python"]
    command: ["-m", "vendor_service.main"]
    environment:
      - MONGODB_URL=mongodb://wfmadmin:tsarolabs%4012345%23@wfm-mongodb:27017/wfm?authSource=admin
      - MONGODB_TLS=false
      - REDIS_URL=redis://wfm-redis:6379
      - DATABASE_NAME=wfm
      - JWT_SECRET_KEY=wfmv4-super-secret-jwt-key-change-in-production
      - ENVIRONMENT=development
      - ENV_FILE=env.local
    volumes:
      - ./wfmServices/logs:/app/logs
    networks:
      - wfm-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  process-service:
    build:
      context: ./wfmServices
      dockerfile: Dockerfile
    container_name: wfm_process_service
    restart: unless-stopped
    ports:
      - "8010:8010"
    command: ["uvicorn", "process_service.main:app", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      - MONGODB_URL=mongodb://wfmadmin:tsarolabs%4012345%23@wfm-mongodb:27017/wfm?authSource=admin
      - MONGODB_TLS=false
      - REDIS_URL=redis://wfm-redis:6379
      - DATABASE_NAME=wfm
      - JWT_SECRET_KEY=wfmv4-super-secret-jwt-key-change-in-production
      - ENVIRONMENT=development
      - ENV_FILE=env.local
      - BPMN_ENGINE_URL=http://wfmprocess-backend:8000
    volumes:
      - ./wfmServices/logs:/app/logs
    networks:
      - wfm-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # INTEGRATION SERVICES LAYER - Start after backend services
  integration-service:
    build:
      context: ./intServices
      dockerfile: Dockerfile
    container_name: wfm_integration_service
    environment:
      - ENV=dev
      - PORT=8082
      - DATABASE_URL=postgresql+asyncpg://workflow_user:workflow_pass@wfm-postgres:5432/workflow
      - RULES_API_BASE_URL=http://wfm_rules_service:8003
      - SCHEDULER_API_BASE_URL=http://wfm_scheduler_service:8004
      - ORDER_API_BASE_URL=http://wfm_order_service:8008
      - API_KEY=change-me-please
      - JWT_SECRET=your-super-secret-key-change-in-production
      - RULES_JWT_SECRET=your-super-secret-key-change-in-production
      - RULES_TENANT_ID=test-tenant
      - INTSERVICES_SKIP_DB_INIT=true
    volumes:
      - ./intServices:/app
      - /app/__pycache__
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rules-service:
        condition: service_started
      scheduler-service:
        condition: service_started
      order-service:
        condition: service_started
    networks:
      - wfm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8082/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 3. BPMN PROCESS ENGINE LAYER - Start after backend services
  wfmprocess-backend:
    build:
      context: ./wfmProcess/backend
      dockerfile: Dockerfile
    container_name: wfm-bpmn-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://workflow_user:workflow_pass@wfm-postgres:5432/workflow
      - REDIS_URL=redis://wfm-redis:6379
      - MONGODB_URL=mongodb://wfmadmin:tsarolabs%4012345%23@wfm-mongodb:27017/wfm?authSource=admin
      - MONGODB_DATABASE=wfm
      - SECRET_KEY=your-super-secret-key-change-in-production
      - DEBUG=true
      - LOG_LEVEL=INFO
      - ALLOWED_BPMN_EXTENSIONS=[".bpmn",".xml"]
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:8000","http://localhost:3001"]
      - CORS_ALLOW_CREDENTIALS=true
      - CORS_ALLOW_METHODS=["*"]
      - CORS_ALLOW_HEADERS=["*"]
    volumes:
      - ./wfmProcess/backend:/app
      - /app/__pycache__
    ports:
      - "8100:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      api-gateway:
        condition: service_started
      auth-service:
        condition: service_started
    networks:
      - wfm-network
    restart: unless-stopped

  # 4. FRONTEND LAYER - Start last after all backend services
  wfmapp:
    build:
      context: ./wfmApp
      dockerfile: Dockerfile
    container_name: wfm_unified_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_AUTH_SERVICE_URL=http://localhost:8000
      - NEXT_PUBLIC_API_GATEWAY_URL=http://localhost:8000
      - NEXT_PUBLIC_BPMN_BACKEND_URL=http://localhost:8100
    networks:
      - wfm-network
    depends_on:
      api-gateway:
        condition: service_started
      wfmprocess-backend:
        condition: service_started

networks:
  wfm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mongodb_data:
    driver: local
  wfm_logs:
    driver: local
