[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=shared
    --cov=auth_service
    --cov=config_service
    --cov=rules_service
    --cov=scheduler_service
    --cov=issue_service
    --cov=analytics_service
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=90
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    auth: Authentication related tests
    tracing: Distributed tracing tests
    logging: Logging and monitoring tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning 