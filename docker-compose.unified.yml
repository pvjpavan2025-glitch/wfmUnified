      context: ./wfmServices
      dockerfile: Dockerfile
    container_name: wfm_config_service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - MONGODB_URL=mongodb+srv://wfmadmin:tsarolabs%4012345%23@wfmdb.cvkb04l.mongodb.net/?retryWrites=true&w=majority&appName=wfmDB
      - REDIS_URL=redis://default:kIdJfI3xoLxHiKFnCrkGBYffiDla8Y9h@redis-15514.c56.east-us.azure.redns.redis-cloud.com:15514
      - DATABASE_NAME=wfm
      - JWT_SECRET_KEY=wfmv4-super-secret-jwt-key-change-in-production
      - ENVIRONMENT=local
      - ENV_FILE=env.local
    volumes:
      - ./wfmServices/logs:/app/logs
    networks:
      - wfm-network

  rules-service:
    build:
      context: ./wfmServices
      dockerfile: Dockerfile
    container_name: wfm_rules_service
    restart: unless-stopped
    ports:
      - "8003:8003"
    entrypoint: ["python"]
    command: ["-m", "rules_service.main"]
    environment:
      - MONGODB_URL=mongodb+srv://wfmadmin:tsarolabs%4012345%23@wfmdb.cvkb04l.mongodb.net/?retryWrites=true&w=majority&appName=wfmDB
      - REDIS_URL=redis://default:kIdJfI3xoLxHiKFnCrkGBYffiDla8Y9h@redis-15514.c56.east-us.azure.redns.redis-cloud.com:15514
      - DATABASE_NAME=wfm
      - JWT_SECRET_KEY=wfmv4-super-secret-jwt-key-change-in-production
