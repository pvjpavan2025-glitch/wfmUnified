trigger:
  branches:
    include:
    - main
    - develop
    - feature/*
  paths:
    include:
    - 'wfmApp/**'
    - 'wfmServices/**'
    - 'intServices/**'
    - 'wfmProcess/**'
    - '**/*.tsx'
    - '**/*.ts'
    - '**/*.js'
    - '**/*.jsx'
    - '**/*.py'
    - '**/*.yml'
    - '**/*.yaml'
    - '**/*.txt'
    - '**/*.md'
    - '**/*.json'
    - '**/*.lock'
    - '**/*.toml'
    - '**/*.cfg'
    - '**/*.sh'
    - '**/*.sql'
    - '**/*.env*'
    - '**/*.dockerfile*'
    - '**/*.docker-compose*'

parameters:
- name: sourceBranch
  displayName: 'Source Branch'
  type: string
  default: 'main'
  values:
  - main
  - develop
  - feature/azurePipelines

pool:
  name: SelfHostedPool
  demands:
  - Agent.Name -equals pavans-MacBook-Pro

variables:
  # Azure Configuration
  azureSubscription: 'Azure Subscription'
  resourceGroupName: 'wfm-unified-rg'
  location: 'East US'
  
  # Docker Hub Configuration
  dockerHubUsername: 'pavantsarolabs'
  dockerHubPassword: '$(DOCKER_HUB_PASSWORD)'
  
  # Application Names
  wfmAppName: 'wfm-app'
  wfmServicesName: 'wfm-services'
  intServicesName: 'wfm-int-services'
  wfmProcessName: 'wfm-process'
  
  # Container Registry
  containerRegistry: 'pavantsarolabs'
  
  # Image Tags
  imageTag: '$(Build.BuildId)'
  latestTag: 'latest'
  
  # Azure Web App Names
  wfmAppWebAppName: 'wfm-app-webapp'
  wfmServicesWebAppName: 'wfm-services-webapp'
  intServicesWebAppName: 'wfm-int-services-webapp'
  wfmProcessWebAppName: 'wfm-process-webapp'
  
  # API Management
  apiManagementName: 'wfm-unified-apim'
  apiManagementSku: 'Developer'
  
  # Database Configuration
  postgresServerName: 'wfm-postgres-server'
  postgresDatabaseName: 'wfm'
  postgresAdminUser: 'wfmadmin'
  
  # Network Configuration
  vnetName: 'wfm-unified-vnet'
  subnetName: 'wfm-unified-subnet'
  
  # Docker build target platform
  dockerTargetPlatform: 'linux/amd64'
  
  # App Service Plan
  appServicePlanName: 'wfm-unified-plan'
  appServicePlanSku: 'B2'
  
  # Preferred regions
  preferredRegions: 'East US,East US 2,Central US,West US 2'

stages:
- stage: Build
  displayName: 'Build and Push Docker Images'
  jobs:
  - job: BuildAllServices
    displayName: 'Build All WFM Services'
    variables:
      - group: wfm-deployment-vars
    steps:
    - checkout: self
      clean: true
      fetchDepth: 1

    - script: |
        echo "Building from branch: ${{ parameters.sourceBranch }}"
        git checkout ${{ parameters.sourceBranch }} || echo "Already on target branch"
        git pull origin ${{ parameters.sourceBranch }} || echo "Pull failed, continuing with current state"
      displayName: 'Checkout Source Branch'

    - script: |
        echo "Sources under $(Pipeline.Workspace)/s:"
        ls -la "$(Pipeline.Workspace)/s" || true
        echo "Checking for unified structure..."
        ls -la "$(Pipeline.Workspace)/s/wfmApp" || echo "wfmApp not found"
        ls -la "$(Pipeline.Workspace)/s/wfmServices" || echo "wfmServices not found"
        ls -la "$(Pipeline.Workspace)/s/intServices" || echo "intServices not found"
        ls -la "$(Pipeline.Workspace)/s/wfmProcess" || echo "wfmProcess not found"
      displayName: 'Verify Source Structure'

    - script: |
        set -e
        echo "Checking Docker Buildx..."
        if docker buildx version >/dev/null 2>&1; then
          echo "Buildx is available:"
          docker buildx version
          if ! docker buildx inspect unified-builder >/dev/null 2>&1; then
            docker buildx create --name unified-builder --use
          else
            docker buildx use unified-builder
          fi
          docker buildx inspect --bootstrap
        else
          echo "WARNING: Docker Buildx not available; builds will use default platform."
        fi
      displayName: 'Setup Docker Buildx'

    - task: UsePythonVersion@0
      displayName: 'Use Python 3.11'
      inputs:
        versionSpec: '3.11'

    - task: NodeTool@0
      displayName: 'Use Node.js 18'
      inputs:
        versionSpec: '18.x'
        addToPath: true

    - script: |
        set -e
        echo "Logging into Docker Hub..."
        if [ -z "$DOCKER_HUB_PASSWORD" ]; then
          echo "ERROR: DOCKER_HUB_PASSWORD is empty. Check variable group configuration."
          exit 1
        fi
        printf "%s" "$DOCKER_HUB_PASSWORD" | docker login -u $(dockerHubUsername) --password-stdin
      displayName: 'Login to Docker Hub'
      env:
        DOCKER_HUB_PASSWORD: $(DOCKER_HUB_PASSWORD)

    # Build wfmApp
    - script: |
        set -e
        echo "Building wfmApp..."
        SRC_DIR="$(Pipeline.Workspace)/s/wfmApp"
        if [ ! -d "$SRC_DIR" ]; then
          echo "ERROR: wfmApp source not found at $SRC_DIR"
          exit 1
        fi
        cd "$SRC_DIR"
        IMAGE="$(containerRegistry)/$(wfmAppName)"
        if docker buildx version >/dev/null 2>&1; then
          docker buildx build \
            --platform "$(dockerTargetPlatform)" \
            -t "${IMAGE}:$(imageTag)" \
            -t "${IMAGE}:$(latestTag)" \
            . \
            --load
        else
          docker build -t "${IMAGE}:$(imageTag)" .
          docker tag "${IMAGE}:$(imageTag)" "${IMAGE}:$(latestTag)"
        fi
        echo "Built wfmApp image: ${IMAGE}:$(imageTag)"
      displayName: 'Build wfmApp Docker Image'

    # Build wfmServices
    - script: |
        set -e
        echo "Building wfmServices..."
        SRC_DIR="$(Pipeline.Workspace)/s/wfmServices"
        if [ ! -d "$SRC_DIR" ]; then
          echo "ERROR: wfmServices source not found at $SRC_DIR"
          exit 1
        fi
        cd "$SRC_DIR"
        IMAGE="$(containerRegistry)/$(wfmServicesName)"
        if docker buildx version >/dev/null 2>&1; then
          docker buildx build \
            --platform "$(dockerTargetPlatform)" \
            -t "${IMAGE}:$(imageTag)" \
            -t "${IMAGE}:$(latestTag)" \
            . \
            --load
        else
          docker build -t "${IMAGE}:$(imageTag)" .
          docker tag "${IMAGE}:$(imageTag)" "${IMAGE}:$(latestTag)"
        fi
        echo "Built wfmServices image: ${IMAGE}:$(imageTag)"
      displayName: 'Build wfmServices Docker Image'

    # Build intServices
    - script: |
        set -e
        echo "Building intServices..."
        SRC_DIR="$(Pipeline.Workspace)/s/intServices"
        if [ ! -d "$SRC_DIR" ]; then
          echo "ERROR: intServices source not found at $SRC_DIR"
          exit 1
        fi
        cd "$SRC_DIR"
        # Ensure .env.example exists
        if [ ! -f .env.example ]; then
          echo "Creating placeholder .env.example"
          printf "APP_NAME=Integration Layer\nENV=production\nPORT=8082\n" > .env.example
        fi
        IMAGE="$(containerRegistry)/$(intServicesName)"
        if docker buildx version >/dev/null 2>&1; then
          docker buildx build \
            --platform "$(dockerTargetPlatform)" \
            -t "${IMAGE}:$(imageTag)" \
            -t "${IMAGE}:$(latestTag)" \
            . \
            --load
        else
          docker build -t "${IMAGE}:$(imageTag)" .
          docker tag "${IMAGE}:$(imageTag)" "${IMAGE}:$(latestTag)"
        fi
        echo "Built intServices image: ${IMAGE}:$(imageTag)"
      displayName: 'Build intServices Docker Image'

    # Build wfmProcess
    - script: |
        set -e
        echo "Building wfmProcess..."
        SRC_DIR="$(Pipeline.Workspace)/s/wfmProcess/backend"
        if [ ! -d "$SRC_DIR" ]; then
          echo "ERROR: wfmProcess backend source not found at $SRC_DIR"
          exit 1
        fi
        cd "$SRC_DIR"
        IMAGE="$(containerRegistry)/$(wfmProcessName)"
        if docker buildx version >/dev/null 2>&1; then
          docker buildx build \
            --platform "$(dockerTargetPlatform)" \
            -t "${IMAGE}:$(imageTag)" \
            -t "${IMAGE}:$(latestTag)" \
            . \
            --load
        else
          docker build -t "${IMAGE}:$(imageTag)" .
          docker tag "${IMAGE}:$(imageTag)" "${IMAGE}:$(latestTag)"
        fi
        echo "Built wfmProcess image: ${IMAGE}:$(imageTag)"
      displayName: 'Build wfmProcess Docker Image'

    # Push all images to Docker Hub
    - script: |
        echo "Pushing all images to Docker Hub..."
        for SERVICE in $(wfmAppName) $(wfmServicesName) $(intServicesName) $(wfmProcessName); do
          echo "Pushing $SERVICE..."
          docker push $(containerRegistry)/$SERVICE:$(imageTag)
          docker push $(containerRegistry)/$SERVICE:$(latestTag)
        done
        echo "All images pushed successfully"
      displayName: 'Push All Images to Docker Hub'

- stage: Deploy
  displayName: 'Deploy to Azure'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployToAzure
    displayName: 'Deploy Unified WFM to Azure'
    environment: 'wfm-production'
    variables:
      - group: wfm-deployment-vars
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: 'Login and Verify Azure Access'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                az account show
                echo "Successfully logged into Azure"

          - task: AzureCLI@2
            displayName: 'Register Required Resource Providers'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                PROVIDERS=(
                  "Microsoft.Web"
                  "Microsoft.ApiManagement"
                  "Microsoft.DBforPostgreSQL"
                  "Microsoft.Network"
                )
                for PROVIDER in "${PROVIDERS[@]}"; do
                  echo "Registering provider: $PROVIDER"
                  az provider register --namespace "$PROVIDER" --wait
                done

          - task: AzureCLI@2
            displayName: 'Create Resource Group'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                az group create \
                  --name "$(resourceGroupName)" \
                  --location "$(location)"
                echo "Resource group created/verified"

          - task: AzureCLI@2
            displayName: 'Create Azure PostgreSQL Database'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                echo "Creating PostgreSQL server..."
                az postgres flexible-server create \
                  --resource-group "$(resourceGroupName)" \
                  --name "$(postgresServerName)" \
                  --location "$(location)" \
                  --admin-user "$(postgresAdminUser)" \
                  --admin-password "$(POSTGRES_PASSWORD)" \
                  --sku-name Standard_B1ms \
                  --tier Burstable \
                  --storage-size 32 \
                  --version 15 \
                  --public-access 0.0.0.0-255.255.255.255 \
                  --yes
                
                echo "Creating database..."
                az postgres flexible-server db create \
                  --resource-group "$(resourceGroupName)" \
                  --server-name "$(postgresServerName)" \
                  --database-name "$(postgresDatabaseName)"
                
                echo "PostgreSQL setup complete"

          - task: AzureCLI@2
            displayName: 'Create Virtual Network'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                echo "Creating virtual network..."
                az network vnet create \
                  --resource-group "$(resourceGroupName)" \
                  --name "$(vnetName)" \
                  --address-prefix 10.0.0.0/16 \
                  --subnet-name "$(subnetName)" \
                  --subnet-prefix 10.0.1.0/24 \
                  --location "$(location)"
                echo "Virtual network created"

          - task: AzureCLI@2
            displayName: 'Create App Service Plan'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                echo "Creating App Service Plan..."
                az appservice plan create \
                  --resource-group "$(resourceGroupName)" \
                  --name "$(appServicePlanName)" \
                  --location "$(location)" \
                  --sku "$(appServicePlanSku)" \
                  --is-linux
                echo "App Service Plan created"

          - task: AzureCLI@2
            displayName: 'Create Web Apps'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                PLAN_NAME="$(appServicePlanName)"
                RG="$(resourceGroupName)"
                
                # Create wfmApp Web App
                echo "Creating wfmApp Web App..."
                az webapp create \
                  --resource-group "$RG" \
                  --plan "$PLAN_NAME" \
                  --name "$(wfmAppWebAppName)" \
                  --deployment-container-image-name "$(containerRegistry)/$(wfmAppName):$(imageTag)"
                
                # Create wfmServices Web App
                echo "Creating wfmServices Web App..."
                az webapp create \
                  --resource-group "$RG" \
                  --plan "$PLAN_NAME" \
                  --name "$(wfmServicesWebAppName)" \
                  --deployment-container-image-name "$(containerRegistry)/$(wfmServicesName):$(imageTag)"
                
                # Create intServices Web App
                echo "Creating intServices Web App..."
                az webapp create \
                  --resource-group "$RG" \
                  --plan "$PLAN_NAME" \
                  --name "$(intServicesWebAppName)" \
                  --deployment-container-image-name "$(containerRegistry)/$(intServicesName):$(imageTag)"
                
                # Create wfmProcess Web App
                echo "Creating wfmProcess Web App..."
                az webapp create \
                  --resource-group "$RG" \
                  --plan "$PLAN_NAME" \
                  --name "$(wfmProcessWebAppName)" \
                  --deployment-container-image-name "$(containerRegistry)/$(wfmProcessName):$(imageTag)"
                
                echo "All Web Apps created successfully"

          - task: AzureCLI@2
            displayName: 'Configure Environment Variables'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                RG="$(resourceGroupName)"
                
                # Get PostgreSQL connection string
                POSTGRES_HOST="$(postgresServerName).postgres.database.azure.com"
                POSTGRES_URL="postgresql://$(postgresAdminUser):$(POSTGRES_PASSWORD)@$POSTGRES_HOST:5432/$(postgresDatabaseName)?sslmode=require"
                
                # Get Web App URLs for internal communication
                WFM_SERVICES_URL="https://$(wfmServicesWebAppName).azurewebsites.net"
                INT_SERVICES_URL="https://$(intServicesWebAppName).azurewebsites.net"
                WFM_PROCESS_URL="https://$(wfmProcessWebAppName).azurewebsites.net"
                
                # Configure wfmApp (Frontend)
                echo "Configuring wfmApp environment..."
                az webapp config appsettings set \
                  --resource-group "$RG" \
                  --name "$(wfmAppWebAppName)" \
                  --settings \
                    WEBSITES_PORT="3000" \
                    NEXT_PUBLIC_API_GATEWAY_URL="$WFM_SERVICES_URL" \
                    NEXT_PUBLIC_PROCESS_ENGINE_URL="$WFM_PROCESS_URL" \
                    ENVIRONMENT="production"
                
                # Configure wfmServices (Main Backend)
                echo "Configuring wfmServices environment..."
                az webapp config appsettings set \
                  --resource-group "$RG" \
                  --name "$(wfmServicesWebAppName)" \
                  --settings \
                    WEBSITES_PORT="8000" \
                    MONGODB_URL="$(MONGODB_URL)" \
                    REDIS_URL="$(REDIS_URL)" \
                    POSTGRES_URL="$POSTGRES_URL" \
                    DATABASE_NAME="wfm" \
                    JWT_SECRET_KEY="$(JWT_SECRET_KEY)" \
                    ENVIRONMENT="production"
                
                # Configure intServices
                echo "Configuring intServices environment..."
                az webapp config appsettings set \
                  --resource-group "$RG" \
                  --name "$(intServicesWebAppName)" \
                  --settings \
                    WEBSITES_PORT="8082" \
                    MONGODB_URL="$(MONGODB_URL)" \
                    REDIS_URL="$(REDIS_URL)" \
                    POSTGRES_URL="$POSTGRES_URL" \
                    DATABASE_NAME="wfm" \
                    JWT_SECRET_KEY="$(JWT_SECRET_KEY)" \
                    ENVIRONMENT="production"
                
                # Configure wfmProcess (BPMN Engine)
                echo "Configuring wfmProcess environment..."
                az webapp config appsettings set \
                  --resource-group "$RG" \
                  --name "$(wfmProcessWebAppName)" \
                  --settings \
                    WEBSITES_PORT="8100" \
                    POSTGRES_URL="$POSTGRES_URL" \
                    DATABASE_NAME="wfm" \
                    JWT_SECRET_KEY="$(JWT_SECRET_KEY)" \
                    ENVIRONMENT="production"
                
                echo "All environment variables configured"

          - task: AzureCLI@2
            displayName: 'Create API Management Service'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                echo "Creating API Management service..."
                az apim create \
                  --resource-group "$(resourceGroupName)" \
                  --name "$(apiManagementName)" \
                  --location "$(location)" \
                  --publisher-email "admin@tsarolabs.com" \
                  --publisher-name "Tsaro Labs" \
                  --sku-name "$(apiManagementSku)" \
                  --no-wait
                echo "API Management service creation initiated (this may take 30-45 minutes)"

          - task: AzureCLI@2
            displayName: 'Configure API Management APIs'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                echo "Waiting for API Management service to be ready..."
                
                # Wait for APIM to be ready (with timeout)
                TIMEOUT=3600  # 1 hour timeout
                ELAPSED=0
                while [ $ELAPSED -lt $TIMEOUT ]; do
                  STATUS=$(az apim show --resource-group "$(resourceGroupName)" --name "$(apiManagementName)" --query "provisioningState" -o tsv 2>/dev/null || echo "NotFound")
                  if [ "$STATUS" = "Succeeded" ]; then
                    echo "API Management service is ready"
                    break
                  fi
                  echo "API Management status: $STATUS (waiting...)"
                  sleep 60
                  ELAPSED=$((ELAPSED + 60))
                done
                
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "WARNING: API Management service not ready after timeout. Skipping API configuration."
                  exit 0
                fi
                
                # Configure APIs
                WFM_SERVICES_URL="https://$(wfmServicesWebAppName).azurewebsites.net"
                WFM_PROCESS_URL="https://$(wfmProcessWebAppName).azurewebsites.net"
                
                # Create WFM Services API
                echo "Creating WFM Services API..."
                az apim api create \
                  --resource-group "$(resourceGroupName)" \
                  --service-name "$(apiManagementName)" \
                  --api-id "wfm-services-api" \
                  --display-name "WFM Services API" \
                  --path "api/v1" \
                  --service-url "$WFM_SERVICES_URL" \
                  --protocols https
                
                # Create WFM Process API
                echo "Creating WFM Process API..."
                az apim api create \
                  --resource-group "$(resourceGroupName)" \
                  --service-name "$(apiManagementName)" \
                  --api-id "wfm-process-api" \
                  --display-name "WFM Process API" \
                  --path "process/v1" \
                  --service-url "$WFM_PROCESS_URL" \
                  --protocols https
                
                echo "API Management configuration completed"

          - task: AzureCLI@2
            displayName: 'Get Deployment URLs and Information'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                echo "=== WFM Unified Deployment Information ==="
                
                # Get Web App URLs
                echo "=== Application URLs ==="
                for APP in "$(wfmAppWebAppName)" "$(wfmServicesWebAppName)" "$(intServicesWebAppName)" "$(wfmProcessWebAppName)"; do
                  HOST=$(az webapp show --resource-group "$(resourceGroupName)" --name "$APP" --query defaultHostName -o tsv 2>/dev/null || echo "NOT_FOUND")
                  if [ "$HOST" != "NOT_FOUND" ]; then
                    echo "$APP: https://$HOST"
                  else
                    echo "$APP: NOT FOUND"
                  fi
                done
                
                # Get API Management URL
                echo ""
                echo "=== API Management ==="
                APIM_URL=$(az apim show --resource-group "$(resourceGroupName)" --name "$(apiManagementName)" --query "gatewayUrl" -o tsv 2>/dev/null || echo "NOT_READY")
                if [ "$APIM_URL" != "NOT_READY" ]; then
                  echo "API Management Gateway: $APIM_URL"
                  echo "API Management Portal: https://$(apiManagementName).portal.azure-api.net"
                else
                  echo "API Management: Still provisioning (check Azure Portal)"
                fi
                
                # Get Database Information
                echo ""
                echo "=== Database Information ==="
                echo "PostgreSQL Server: $(postgresServerName).postgres.database.azure.com"
                echo "PostgreSQL Database: $(postgresDatabaseName)"
                echo "MongoDB: Using Mongo Atlas Cloud ($(MONGODB_URL))"
                echo "Redis: Using Redis Cloud ($(REDIS_URL))"
                
                # Get outbound IPs for allowlisting
                echo ""
                echo "=== Outbound IP Addresses (for SaaS allowlists) ==="
                for APP in "$(wfmServicesWebAppName)" "$(intServicesWebAppName)" "$(wfmProcessWebAppName)"; do
                  IPs=$(az webapp show --resource-group "$(resourceGroupName)" --name "$APP" --query outboundIpAddresses -o tsv 2>/dev/null || echo "NOT_FOUND")
                  if [ "$IPs" != "NOT_FOUND" ]; then
                    echo "$APP: $IPs"
                  fi
                done
                
                echo "=========================================="

- stage: PostDeployment
  displayName: 'Post-Deployment Verification'
  dependsOn: Deploy
  condition: succeeded()
  jobs:
  - job: VerifyDeployment
    displayName: 'Verify All Services'
    timeoutInMinutes: 15
    steps:
    - task: AzureCLI@2
      displayName: 'Health Check All Services'
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -eo pipefail
          echo "Waiting for services to start..."
          sleep 60
          
          FAILED=0
          APPS=("$(wfmAppWebAppName)" "$(wfmServicesWebAppName)" "$(intServicesWebAppName)" "$(wfmProcessWebAppName)")
          
          for APP in "${APPS[@]}"; do
            echo "Checking $APP..."
            HOST=$(az webapp show --resource-group "$(resourceGroupName)" --name "$APP" --query defaultHostName -o tsv 2>/dev/null || echo "NOT_FOUND")
            
            if [ "$HOST" = "NOT_FOUND" ]; then
              echo "[ERROR] Could not resolve hostname for $APP"
              FAILED=1
              continue
            fi
            
            BASE_URL="https://$HOST"
            
            # Choose appropriate health endpoint
            if [ "$APP" = "$(wfmAppWebAppName)" ]; then
              HEALTH_URL="$BASE_URL/"
            else
              HEALTH_URL="$BASE_URL/health"
            fi
            
            echo "Testing: $HEALTH_URL"
            HTTP_CODE=$(curl -L --connect-timeout 10 --max-time 30 -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "[OK] $APP is healthy (HTTP $HTTP_CODE)"
            else
              echo "[ERROR] $APP health check failed (HTTP $HTTP_CODE)"
              FAILED=1
            fi
          done
          
          if [ $FAILED -eq 0 ]; then
            echo "All services are healthy!"
          else
            echo "Some services failed health checks"
            exit 1
          fi

    - script: |
        echo "=== WFM Unified Deployment Summary ==="
        echo "Build ID: $(Build.BuildId)"
        echo "Source Branch: ${{ parameters.sourceBranch }}"
        echo "Docker Images Tagged: $(imageTag)"
        echo "Docker Hub Repository: https://hub.docker.com/repositories/$(containerRegistry)"
        echo ""
        echo "=== Next Steps ==="
        echo "1. Add Web App outbound IPs to MongoDB Atlas and Redis Cloud allowlists"
        echo "2. Update wfmApp configuration to use API Management endpoints"
        echo "3. Test all application functionality"
        echo "4. Configure custom domains if needed"
        echo "=================================="
      displayName: 'Deployment Summary'
