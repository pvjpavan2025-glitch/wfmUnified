      - "8010:8010"
    entrypoint: ["python"]
    command: ["-m", "process_service.main"]
    environment:
      - MONGODB_URL=mongodb+srv://wfmadmin:tsarolabs%4012345%23@wfmdb.cvkb04l.mongodb.net/?retryWrites=true&w=majority&appName=wfmDB
      - REDIS_URL=redis://default:kIdJfI3xoLxHiKFnCrkGBYffiDla8Y9h@redis-15514.c56.east-us.azure.redns.redis-cloud.com:15514
      - DATABASE_NAME=wfm
      - JWT_SECRET_KEY=wfmv4-super-secret-jwt-key-change-in-production
      - ENVIRONMENT=production
      - ENV_FILE=env.online
      - BPMN_ENGINE_URL=http://wfmprocess-backend:8000
    volumes:
      - ./wfmServices/logs:/app/logs
    networks:
      - wfm-network
    depends_on:
      - wfmprocess-backend

  # Unified Frontend Application (wfmApp with integrated wfmProcess frontend)
  wfmapp:
    build:
      context: ./wfmApp
      dockerfile: Dockerfile
    container_name: wfm_unified_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_AUTH_SERVICE_URL=http://localhost:8000
      - NEXT_PUBLIC_API_GATEWAY_URL=http://localhost:8000
      - NEXT_PUBLIC_BPMN_BACKEND_URL=http://localhost:8100
    networks:
      - wfm-network
    depends_on:
      - api-gateway
      - wfmprocess-backend

  # Optional: Reverse Proxy for better routing
  traefik:
    image: traefik:v2.10
    container_name: wfm-traefik
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - wfm-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

networks:
  wfm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  wfm_logs:
    driver: local
