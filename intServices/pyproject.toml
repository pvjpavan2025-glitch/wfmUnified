[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intservices"
version = "0.1.0"
description = "Integration Layer for WFM - FastAPI based"
readme = "README.md"
authors = [{name = "WFM Team"}]
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "sqlmodel>=0.0.16",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "greenlet>=3.0",
  "python-multipart>=0.0.9",
  "email-validator>=2.1",
  "orjson>=3.10",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "lxml>=4.9.0",
  "requests>=2.28.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["app/tests"]

[tool.pytest-asyncio]
mode = "auto"

[tool.black]
line-length = 100
