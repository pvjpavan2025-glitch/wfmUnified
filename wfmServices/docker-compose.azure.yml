version: '3.8'
services:
  api-gateway:
    image: __ACR_LOGIN_SERVER__/api-gateway:__TAG__
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=__MONGO_URI__
      - REDIS_URL=__REDIS_URL__
      - DATABASE_NAME=wfm
      - JWT_SECRET_KEY=__JWT_SECRET__
      - ENVIRONMENT=production
  auth-service:
    image: __ACR_LOGIN_SERVER__/auth-service:__TAG__
    ports:
      - "8001:8001"
    environment:
      - MONGODB_URL=__MONGO_URI__
      - REDIS_URL=__REDIS_URL__
      - DATABASE_NAME=wfm
