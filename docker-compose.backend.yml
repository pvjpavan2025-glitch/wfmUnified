version: "3.8"

services:
  # WFM Backend Services
  api-gateway:
    build:
      context: ./wfmServices
      dockerfile: Dockerfile
    container_name: wfm_api_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://wfmadmin:tsarolabs%4012345%23@wfm-mongodb:27017/wfm?authSource=admin
      - REDIS_URL=redis://wfm-redis:6379
      - DATABASE_NAME=wfm
      - JWT_SECRET_KEY=wfmv4-super-secret-jwt-key-change-in-production
      - ENVIRONMENT=development
      - ENV_FILE=env.local
    volumes:
      - ./wfmServices/logs:/app/logs
    networks:
      - wfm-network
    depends_on:
      - wfm-mongodb
      - wfm-redis

  auth-service:
    build:
      context: ./wfmServices
      dockerfile: Dockerfile.auth
    container_name: wfm_auth_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - MONGODB_URL=mongodb://wfmadmin:tsarolabs%4012345%23@wfm-mongodb:27017/wfm?authSource=admin
      - REDIS_URL=redis://wfm-redis:6379
      - DATABASE_NAME=wfm
      - JWT_SECRET_KEY=wfmv4-super-secret-jwt-key-change-in-production
      - ENVIRONMENT=development
      - ENV_FILE=env.local
    networks:
      - wfm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["python", "auth_service/simple_main.py"]
    depends_on:
      - wfm-mongodb
      - wfm-redis

  config-service:
    build:
      context: ./wfmServices
      dockerfile: Dockerfile
    container_name: wfm_config_service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - MONGODB_URL=mongodb://wfmadmin:tsarolabs%4012345%23@wfm-mongodb:27017/wfm?authSource=admin
      - REDIS_URL=redis://wfm-redis:6379
      - DATABASE_NAME=wfm
      - JWT_SECRET_KEY=wfmv4-super-secret-jwt-key-change-in-production
      - ENVIRONMENT=development
      - ENV_FILE=env.local
    volumes:
      - ./wfmServices/logs:/app/logs
    networks:
      - wfm-network
    depends_on:
      - wfm-mongodb
      - wfm-redis

  rules-service:
    build:
      context: ./wfmServices
      dockerfile: Dockerfile
    container_name: wfm_rules_service
    restart: unless-stopped
    ports:
      - "8003:8003"
    entrypoint: ["python"]
    command: ["-m", "rules_service.main"]
    environment:
      - MONGODB_URL=mongodb://wfmadmin:tsarolabs%4012345%23@wfm-mongodb:27017/wfm?authSource=admin
      - REDIS_URL=redis://wfm-redis:6379
      - DATABASE_NAME=wfm
      - JWT_SECRET_KEY=wfmv4-super-secret-jwt-key-change-in-production
      - ENVIRONMENT=development
      - ENV_FILE=env.local
    volumes:
      - ./wfmServices/logs:/app/logs
    networks:
