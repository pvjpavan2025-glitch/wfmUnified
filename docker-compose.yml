version: "3.8"

services:
  # PostgreSQL Database for wfmProcess
  postgres:
    image: postgres:15
    container_name: wfm-postgres
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: workflow_user
      POSTGRES_PASSWORD: workflow_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./wfmProcess/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - wfm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow_user -d workflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache for wfmProcess
  redis:
    image: redis:7-alpine
    container_name: wfm-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - wfm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # wfmProcess Backend (BPMN Engine)
  wfmprocess-backend:
    build:
      context: ./wfmProcess/backend
      dockerfile: Dockerfile
    container_name: wfm-bpmn-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://workflow_user:workflow_pass@postgres:5432/workflow
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=your-super-secret-key-change-in-production
      - DEBUG=true
      - LOG_LEVEL=INFO
    volumes:
      - ./wfmProcess/backend:/app
      - /app/__pycache__
    ports:
      - "8100:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wfm-network
    restart: unless-stopped

  # WFM Backend Services
  api-gateway:
    build:
      context: ./wfmServices
      dockerfile: Dockerfile
    container_name: wfm_api_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb+srv://wfmadmin:tsarolabs%4012345%23@wfmdb.cvkb04l.mongodb.net/?retryWrites=true&w=majority&appName=wfmDB
      - REDIS_URL=redis://default:kIdJfI3xoLxHiKFnCrkGBYffiDla8Y9h@redis-15514.c56.east-us.azure.redns.redis-cloud.com:15514
      - DATABASE_NAME=wfm
      - JWT_SECRET_KEY=wfmv4-super-secret-jwt-key-change-in-production
      - ENVIRONMENT=production
      - ENV_FILE=env.online
    volumes:
      - ./wfmServices/logs:/app/logs
    networks:
      - wfm-network

  auth-service:
    build:
      context: ./wfmServices
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth_service
    container_name: wfm_auth_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - MONGODB_URL=mongodb+srv://wfmadmin:tsarolabs%4012345%23@wfmdb.cvkb04l.mongodb.net/?retryWrites=true&w=majority&appName=wfmDB
      - REDIS_URL=redis://default:kIdJfI3xoLxHiKFnCrkGBYffiDla8Y9h@redis-15514.c56.east-us.azure.redns.redis-cloud.com:15514
      - DATABASE_NAME=wfm
      - JWT_SECRET_KEY=wfmv4-super-secret-jwt-key-change-in-production
      - ENVIRONMENT=production
      - ENV_FILE=env.online
    volumes:
      - ./wfmServices/logs:/app/logs
    networks:
      - wfm-network
    command: ["python", "-m", "auth_service.main"]

  config-service:
