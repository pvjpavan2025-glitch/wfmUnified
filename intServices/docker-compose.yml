version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: intsvc
      POSTGRES_PASSWORD: intsvc
      POSTGRES_DB: intservices
    volumes:
      - intsvc_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intsvc -d intservices"]
      interval: 5s
      timeout: 5s
      retries: 10

  intservices:
    build: .
    environment:
      # app settings
      APP_NAME: "Integration Layer"
      ENV: docker
      PORT: 8082
      ALLOWED_ORIGINS: "http://localhost:3000"
      API_KEY_NAME: X-API-Key
      API_KEY: change-me-please
      # database
      DATABASE_URL: postgresql+asyncpg://intsvc:intsvc@db:5432/intservices
      # rules api (wfmServices rules-service typically listens on 8003)
      RULES_API_BASE_URL: http://host.docker.internal:8003
      RULES_API_TOKEN: "${WFM_JWT:-}"
      RULES_API_TIMEOUT_SECONDS: 15
      RULES_API_STUB: "true"
      # scheduler api
      SCHEDULER_API_BASE_URL: http://host.docker.internal:8004
      SCHEDULER_API_TOKEN: "${WFM_JWT:-}"
      SCHEDULER_API_TIMEOUT_SECONDS: 15
      SCHEDULER_API_STUB: "true"
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  intsvc_pgdata:
    driver: local
