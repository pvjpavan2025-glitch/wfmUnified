version: "3.8"

services:
  # PostgreSQL Database for wfmProcess
  postgres:
    image: postgres:15
    container_name: wfm-postgres
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: workflow_user
      POSTGRES_PASSWORD: workflow_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./wfmProcess/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - wfm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow_user -d workflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache for wfmProcess
  redis:
    image: redis:7-alpine
    container_name: wfm-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - wfm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Local for development/testing
  mongodb:
    image: mongo:7
    container_name: wfm-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: wfmadmin
      MONGO_INITDB_ROOT_PASSWORD: tsarolabs@12345#
      MONGO_INITDB_DATABASE: wfm
    volumes:
      - mongodb_data:/data/db
      - ./wfmServices/docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    ports:
      - "27017:27017"
    networks:
      - wfm-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  wfm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mongodb_data:
    driver: local
