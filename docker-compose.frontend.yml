version: "3.8"

services:
  # Unified Frontend Application (wfmApp with integrated wfmProcess frontend)
  wfmapp:
    build:
      context: ./wfmApp
      dockerfile: Dockerfile
    container_name: wfm_unified_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_AUTH_SERVICE_URL=http://localhost:8000
      - NEXT_PUBLIC_API_GATEWAY_URL=http://localhost:8000
      - NEXT_PUBLIC_BPMN_BACKEND_URL=http://localhost:8100
    networks:
      - wfm-network
    depends_on:
      - wfm_api_gateway
      - wfm-bpmn-backend

networks:
  wfm-network:
    external: true
